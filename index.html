<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>iShopp AI</title>
    <meta name="description" content="South African retail intelligence and smart shopping platform. Snap in-store specials, scan empty or finished pantry items at home, optimize multi-store routes, and submit grocery lists for tiered delivery." />
    
    <!-- PWA & Mobile Web App Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF3366" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iShopp AI" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#FF3366" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="iShopp AI" />
    <meta property="og:description" content="South African retail intelligence and smart shopping platform. Snap in-store specials, scan empty or finished pantry items at home, optimize multi-store routes, and submit grocery lists for tiered delivery." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </head>
  <body class="overscroll-none bg-slate-50 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
